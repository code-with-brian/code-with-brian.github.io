<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>How a CANDU Works</title>
<meta name="description" content="Build a CANDU reactor from one fuel pellet up, then trip it and try to beat the xenon clock. A hands-on primer drawn in ink.">
<meta property="og:title" content="How a CANDU Works">
<meta property="og:description" content="Trip a CANDU reactor. You have about 30 minutes before xenon locks you out for a day and a half.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://code-with-brian.github.io/candu/og.png">
<meta property="og:url" content="https://code-with-brian.github.io/candu/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b2127'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23e9b44c' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e9b44c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil:wght@600;800&family=Sometype+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="block">
      <p class="block-title">How a CANDU Works</p>
      <p class="block-sub">Build a heavy water reactor from one pellet up, then trip it on purpose.</p>
    </div>
      <nav id="nav" aria-label="Lessons"></nav>
    <p class="progress" id="progress"></p>
  </aside>

  <main class="page">
    <header class="head">
      <div class="head-title">
        <h1 id="fig-title"></h1>
        <p id="fig-sub"></p>
      </div>
      <dl class="stats" id="stats" aria-live="off"></dl>
    </header>

    <section class="stage" id="stage">
      <div class="guide" id="guide">
        <span class="guide-step" id="guide-step"></span>
        <div class="guide-text">
          <p class="guide-goal" id="guide-goal"></p>
          <p class="note" id="note" role="status"></p>
        </div>
        <div class="guide-next" id="guide-next"></div>
      </div>
      <div class="bench">
        <p class="bench-label" id="bench-label">Bench</p>
        <div class="bench-actions" id="bench"></div>
        </div>
      <div class="scene" id="scene">
        <svg id="unit" role="img" aria-label="Cut-away isometric drawing of a CANDU nuclear unit" preserveAspectRatio="xMidYMid meet"></svg>
        <svg id="detail" role="img" aria-label="Lesson drawing" preserveAspectRatio="xMidYMid meet" hidden></svg>
        <canvas id="toy" hidden></canvas>
        <p class="scene-hint" id="scene-hint">Tap any part to see what it does</p>
        <div class="peek" id="peek" role="status" hidden></div>
        <div class="alarm-flash" id="flash" aria-hidden="true"></div>
      </div>
    </section>

    <section class="panel" id="panel"></section>

    <section class="lesson">
      <div class="lesson-text" id="text"></div>
      <div class="inspect" id="inspect"></div>
      <div class="log-wrap">
        <h2>Control room log</h2>
        <ol class="log" id="log" aria-live="polite"></ol>
      </div>
    </section>

    <section class="check" id="quiz"></section>
    <section class="tools" aria-label="Drawing settings">
      <label class="tool">Line wobble
        <input id="wobble" type="range" min="0" max="6" step="1" value="0">
      </label>
      <label class="tool toggle"><input id="labels" type="checkbox" checked> Labels</label>
      <label class="tool toggle"><input id="sound" type="checkbox"> Sound</label>
    </section>
    <section class="sources" id="sources"></section>
    <footer class="foot" id="foot"></footer>
  </main>
  <div class="term-pop" id="term-pop" role="tooltip" hidden></div>
</div>
<script src="js/sim.js"></script>
<script src="js/iso.js"></script>
<script src="js/scene-plant.js"></script>
<script src="js/scene-detail.js"></script>
<script src="js/content.js"></script>
<script src="js/app.js"></script>
<script src="js/figs.js"></script>
<script src="js/drills.js"></script>
<script>App.start();</script>
</body>
</html>
